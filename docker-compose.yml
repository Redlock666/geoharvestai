version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geoharvestai
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geo} -d geoharvestai"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: geoharvestai_ts
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo}
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/home/postgres/pgdata/data
      - ./db/timescale_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geo} -d geoharvestai_ts"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      timescaledb:
        condition: service_healthy
    command: python scripts/daily_refresh.py
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
    restart: unless-stopped

  # ── One-shot ingest runner ───────────────────────────────────────────────
  # Usage:  docker compose run --rm ingest python scripts/ingest_soilgrids.py --region IN
  # The service has no default command — always pass one explicitly.
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Scripts talk directly to host-mapped ports when run via docker compose run
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - ./data:/app/data          # raw downloaded files
    profiles: ["ingest"]          # only started when explicitly requested

  # ── One-shot model trainer ───────────────────────────────────────────────
  # Usage:  docker compose run --rm train python ml/train/train_sarimax.py --region IN
  train:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - ./data:/app/data
    profiles: ["train"]           # only started when explicitly requested

volumes:
  postgis_data:
  timescale_data:
